name: Deploy to VM

on:
  push:
    # branches: [main]
    branches: [rufus-prototype]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: game-show.cloud-ip.cc
          username: antonsplavnik
          key: ${{ secrets.VM_SSH_KEY }}
          script_stop: true
          script: |
            cd ~/barrage
            git fetch origin
            # git reset --hard origin/main
            git reset --hard origin/rufus-prototype
            npm install
            sudo pm2 restart barrage
