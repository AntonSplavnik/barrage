name: Deploy to VM

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: game-show.cloud-ip.cc
          username: antonsplavnik
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd ~/barrage
            git pull origin main
            npm install
            sudo pm2 restart barrage
