<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Barrage Admin</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #101116;
      color: #ececf1;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #101116;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      padding: 18px 24px;
      border-bottom: 1px solid #292b34;
      background: #151720;
    }
    h1 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 700;
    }
    main {
      width: min(1180px, calc(100vw - 32px));
      margin: 24px auto 40px;
      display: grid;
      gap: 18px;
    }
    .toolbar, .panel {
      border: 1px solid #292b34;
      border-radius: 8px;
      background: #171922;
      padding: 16px;
    }
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .counts {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .count {
      padding: 7px 10px;
      border: 1px solid #343744;
      border-radius: 6px;
      color: #c8cad3;
      background: #11131b;
      font-size: 0.85rem;
    }
    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    button, a.button {
      border: 1px solid #3a3d49;
      border-radius: 6px;
      background: #20232d;
      color: #f5f5f7;
      padding: 8px 11px;
      font: inherit;
      font-size: 0.9rem;
      cursor: pointer;
      text-decoration: none;
    }
    button:hover, a.button:hover { background: #292d3a; }
    button.danger {
      border-color: #7a2f3a;
      background: #3a161c;
      color: #ffd5da;
    }
    button.danger:hover { background: #4a1d25; }
    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }
    .status {
      min-height: 22px;
      color: #9ea3b4;
      font-size: 0.9rem;
    }
    .status.error { color: #ff8d9a; }
    .status.ok { color: #8ce99a; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }
    th, td {
      padding: 10px 8px;
      border-bottom: 1px solid #282b35;
      text-align: left;
      vertical-align: middle;
    }
    th {
      color: #9ea3b4;
      font-size: 0.76rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    td.numeric, th.numeric { text-align: right; }
    .user-name {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .display-name { font-weight: 700; }
    .username { color: #878c9c; font-size: 0.8rem; }
    .badge {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      border: 1px solid #404555;
      border-radius: 999px;
      padding: 2px 7px;
      color: #c8cad3;
      font-size: 0.75rem;
    }
    .scroll {
      overflow-x: auto;
    }
    @media (max-width: 720px) {
      header { align-items: flex-start; flex-direction: column; }
      main { width: min(100vw - 20px, 1180px); margin-top: 14px; }
      th, td { padding: 9px 6px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Barrage Admin</h1>
    <a class="button" href="/lobby.html">Lobby</a>
  </header>

  <main>
    <section class="toolbar">
      <div>
        <div class="status" id="status">Loading...</div>
        <div class="counts" id="counts"></div>
      </div>
      <div class="actions">
        <button id="refresh-btn" type="button">Refresh</button>
        <button class="danger" id="clear-game-btn" type="button">Clear Game Data</button>
        <button class="danger" id="delete-guests-btn" type="button">Delete Guests</button>
      </div>
    </section>

    <section class="panel">
      <div class="scroll">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>User</th>
              <th>Type</th>
              <th class="numeric">Battles</th>
              <th class="numeric">Wars</th>
              <th>Created</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="users-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script type="module">
    const token = sessionStorage.getItem("barrage_token");
    if (!token) window.location.replace("/login.html");

    const statusEl = document.getElementById("status");
    const countsEl = document.getElementById("counts");
    const usersBody = document.getElementById("users-body");

    function esc(value) {
      return String(value ?? "").replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;",
      }[ch]));
    }

    function setStatus(text, type = "") {
      statusEl.textContent = text;
      statusEl.className = `status ${type}`.trim();
    }

    function dateTime(ts) {
      return ts ? new Date(ts).toLocaleString() : "";
    }

    async function api(path, options = {}) {
      const res = await fetch(path, {
        ...options,
        headers: {
          ...(options.body ? { "Content-Type": "application/json" } : {}),
          Authorization: `Bearer ${token}`,
          ...(options.headers ?? {}),
        },
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || !data.ok) throw new Error(data.error ?? `HTTP ${res.status}`);
      return data;
    }

    function renderCounts(counts) {
      countsEl.innerHTML = Object.entries(counts ?? {}).map(([key, value]) =>
        `<span class="count">${esc(key)}: ${esc(value)}</span>`
      ).join("");
    }

    function renderUsers(users) {
      if (!users?.length) {
        usersBody.innerHTML = `<tr><td colspan="7">No users found.</td></tr>`;
        return;
      }
      usersBody.innerHTML = users.map((u) => `
        <tr>
          <td>${esc(u.id)}</td>
          <td>
            <div class="user-name">
              <span class="display-name">${esc(u.displayName)}</span>
              <span class="username">${esc(u.username)}</span>
            </div>
          </td>
          <td><span class="badge">${u.isGuest ? "guest" : "registered"}</span></td>
          <td class="numeric">${esc(u.battlesWon)}-${esc(u.battlesLost)}</td>
          <td class="numeric">${esc(u.warsWon)}-${esc(u.warsLost)}</td>
          <td>${esc(dateTime(u.createdAt))}</td>
          <td><button class="danger delete-user" type="button" data-id="${esc(u.id)}" data-name="${esc(u.username)}">Delete</button></td>
        </tr>
      `).join("");
    }

    async function load() {
      setStatus("Loading...");
      try {
        const data = await api("/api/admin/summary");
        renderCounts(data.counts);
        renderUsers(data.users);
        setStatus(`Signed in as admin ${data.admin}.`, "ok");
      } catch (err) {
        renderCounts({});
        usersBody.innerHTML = "";
        setStatus(err.message, "error");
      }
    }

    usersBody.addEventListener("click", async (event) => {
      const btn = event.target.closest(".delete-user");
      if (!btn) return;
      const name = btn.dataset.name;
      if (!window.confirm(`Delete user "${name}" and all related game data?`)) return;
      btn.disabled = true;
      try {
        await api(`/api/admin/users/${btn.dataset.id}`, { method: "DELETE" });
        setStatus(`Deleted ${name}.`, "ok");
        await load();
      } catch (err) {
        btn.disabled = false;
        setStatus(err.message, "error");
      }
    });

    document.getElementById("refresh-btn").addEventListener("click", load);

    document.getElementById("clear-game-btn").addEventListener("click", async () => {
      const confirmText = window.prompt('Type "CLEAR GAME DATA" to delete sessions, rounds, stats, and enemies.');
      if (confirmText !== "CLEAR GAME DATA") return;
      try {
        await api("/api/admin/clear-game-data", {
          method: "POST",
          body: JSON.stringify({ confirm: confirmText }),
        });
        setStatus("Cleared game data.", "ok");
        await load();
      } catch (err) {
        setStatus(err.message, "error");
      }
    });

    document.getElementById("delete-guests-btn").addEventListener("click", async () => {
      const confirmText = window.prompt('Type "DELETE GUESTS" to remove all quickplay guest accounts.');
      if (confirmText !== "DELETE GUESTS") return;
      try {
        await api("/api/admin/delete-guests", {
          method: "POST",
          body: JSON.stringify({ confirm: confirmText }),
        });
        setStatus("Deleted guest accounts.", "ok");
        await load();
      } catch (err) {
        setStatus(err.message, "error");
      }
    });

    load();
  </script>
</body>
</html>
