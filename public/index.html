<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Barrage</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="round-counter"></div>
    <div id="hud-opponent">
      <span id="opponent-player"></span>
    </div>
    <div id="hud">
      <span id="connection">Connecting...</span>
      <span id="player"></span>
      <button id="reset" type="button">Reset</button>
      <button id="restart-server" type="button">Restart Server</button>
    </div>
    <button id="fullscreen-btn" title="Fullscreen" aria-label="Toggle fullscreen">
      <svg id="icon-expand" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M3 3h6v2H5v4H3V3zm12 0h6v6h-2V5h-4V3zM3 15h2v4h4v2H3v-6zm16 4h-4v2h6v-6h-2v4z"/>
      </svg>
      <svg id="icon-compress" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" style="display:none">
        <path d="M9 3H7v4H3v2h6V3zm6 0v6h6V7h-4V3h-2zM3 13v2h4v4h2v-6H3zm14 6v-4h4v-2h-6v6h2z"/>
      </svg>
    </button>
    <div id="media-controls">
      <div class="sound-row">
        <button id="music-toggle" type="button" aria-label="Enable music" title="Enable music">
          <span class="music-note" aria-hidden="true">♪</span>
        </button>
        <button id="sfx-toggle" type="button" aria-label="Enable sound effects" title="Enable sound effects">
          <span class="sfx-speaker" aria-hidden="true">🔊</span>
        </button>
      </div>
      <button id="surrender-battle" type="button">Surrender Battle</button>
      <button id="surrender-war"    type="button">Surrender War</button>
    </div>
    <img id="player-portrait-left"  src="/backgrounds/player1.webp" alt="" />
    <img id="player-portrait-right" src="/backgrounds/player2.webp" alt="" />
    <div id="player-name-left"></div>
    <div id="player-name-right"></div>
    <div id="crowns-left"></div>
    <div id="crowns-right"></div>
    <div id="match-winner-overlay">
      <span class="match-winner-crown">👑</span>
      <img id="match-winner-portrait" src="" alt="Match winner" />
      <p id="match-winner-message"></p>
    </div>
    <div id="lobby" class="is-visible">
      <div class="lobby-content">
        <img id="lobby-title" src="/backgrounds/title.webp" alt="Barrage" />
        <div class="lobby-panel">
          <p id="lobby-status">Connecting...</p>
        </div>
      </div>
    </div>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <script src="https://cdn.babylonjs.com/inspector/babylon.inspector.bundle.js"></script>
    <script src="https://unpkg.com/@strudel/web@1.2.3"></script>
    <script type="module" src="/client.js"></script>
    <script>
      const fsBtn = document.getElementById('fullscreen-btn');
      if (!document.fullscreenEnabled) {
        fsBtn.style.display = 'none';
      } else {
        const fsExpand = document.getElementById('icon-expand');
        const fsCompress = document.getElementById('icon-compress');
        fsBtn.addEventListener('click', () => {
          if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
          else document.exitFullscreen();
        });
        document.addEventListener('fullscreenchange', () => {
          const fs = !!document.fullscreenElement;
          fsExpand.style.display = fs ? 'none' : '';
          fsCompress.style.display = fs ? '' : 'none';
        });
      }
    </script>
  </body>
</html>
