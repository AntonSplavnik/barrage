<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barrage — Lobby</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0a0f;
      color: #e0e0e0;
      font-family: system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #lobby-bg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      display: block;
    }

    #lobby-bg-dim {
      position: fixed;
      inset: 0;
      z-index: 1;
      background: rgba(0, 0, 0, 0.45);
      pointer-events: none;
    }

    .lobby-content {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 700px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .title-banner {
      width: 100%;
      max-width: 400px;
      display: block;
      pointer-events: none;
      user-select: none;
    }

    main {
      width: 100%;
      padding: 1.2rem 1.5rem 2rem;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    .section { display: flex; flex-direction: column; gap: 1rem; }
    .section-title { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.12em; color: #888; }

    /* Shared card style used by all panels */
    .panel-card {
      width: 100%;
      background: rgba(20, 20, 30, 0.75);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(42, 42, 62, 0.8);
      border-radius: 10px;
      padding: 1.5rem;
    }

    /* User bar card */
    .user-bar-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    .user-bar { display: flex; align-items: center; gap: 0.5rem; color: #aaa; font-size: 0.9rem; }
    .username { color: #fff; font-weight: 600; }
    .logout-btn {
      background: none; border: 1px solid #333; color: #888;
      border-radius: 4px; padding: 0.3rem 0.7rem; cursor: pointer; font-size: 0.8rem;
    }
    .logout-btn:hover { border-color: #555; color: #ccc; }

    /* Host card */
    .host-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }
    .host-desc { color: #aaa; font-size: 0.9rem; max-width: 340px; line-height: 1.5; }
    .host-desc strong { color: #fff; display: block; font-size: 1rem; margin-bottom: 0.3rem; }

    /* Join card */
    .join-card {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .btn-primary {
      background: #6c63ff;
      color: #fff;
      border: none;
      border-radius: 7px;
      font-size: 0.95rem;
      font-weight: 600;
      padding: 0.65rem 1.4rem;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
    }
    .btn-primary:hover { background: #574fd6; }
    .btn-primary:disabled { background: #333; cursor: default; }

    .sessions-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .refresh-btn {
      background: none; border: 1px solid rgba(42,42,62,0.8); color: #888;
      border-radius: 5px; padding: 0.3rem 0.7rem; cursor: pointer; font-size: 0.8rem;
    }
    .refresh-btn:hover { border-color: #444; color: #ccc; }

    .session-row {
      border-top: 1px solid rgba(42, 42, 62, 0.6);
      padding: 0.9rem 0 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    .session-row:first-child { border-top: none; padding-top: 0; }
    .session-host { font-weight: 600; color: #fff; }
    .session-age { font-size: 0.8rem; color: #666; }

    .btn-join {
      background: none;
      border: 1px solid #6c63ff;
      color: #8b85ff;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 0.45rem 1rem;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .btn-join:hover { background: #6c63ff; color: #fff; }

    .empty-state { color: #666; font-size: 0.9rem; text-align: center; padding: 1.5rem 0; }
    .error-msg { color: #f56565; font-size: 0.85rem; }
    .status-msg { color: #888; font-size: 0.85rem; text-align: center; }

    .btn-leaderboard {
      background: none; border: 1px solid rgba(108,99,255,0.5); color: #8b85ff;
      border-radius: 4px; padding: 0.3rem 0.7rem; cursor: pointer; font-size: 0.8rem;
      transition: background 0.15s, color 0.15s;
    }
    .btn-leaderboard:hover { background: rgba(108,99,255,0.15); color: #fff; }
    .btn-leaderboard.active { background: rgba(108,99,255,0.2); color: #fff; border-color: #6c63ff; }

    /* Leaderboard panel */
    #leaderboard-panel { display: none; flex-direction: column; gap: 1.2rem; }
    #leaderboard-panel.open { display: flex; }

    .lb-table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
    .lb-table th {
      text-align: left; font-size: 0.7rem; text-transform: uppercase;
      letter-spacing: 0.1em; color: #666; padding: 0 0.5rem 0.7rem;
      border-bottom: 1px solid rgba(42,42,62,0.8);
    }
    .lb-table th:not(:first-child) { text-align: center; }
    .lb-table td { padding: 0.6rem 0.5rem; color: #ccc; border-bottom: 1px solid rgba(42,42,62,0.4); }
    .lb-table td:not(:first-child) { text-align: center; color: #aaa; }
    .lb-table tr:last-child td { border-bottom: none; }
    .lb-table .me { color: #fff; font-weight: 600; }
    .lb-table .rank { color: #555; font-size: 0.8rem; width: 1.5rem; }

    .enemies-list { display: flex; flex-direction: column; gap: 0.4rem; margin-top: 0.3rem; }
    .enemy-row { display: flex; justify-content: space-between; align-items: center;
      font-size: 0.85rem; color: #aaa; padding: 0.3rem 0; border-bottom: 1px solid rgba(42,42,62,0.4); }
    .enemy-row:last-child { border-bottom: none; }
    .enemy-name { color: #e0e0e0; }
    .enemy-date { font-size: 0.75rem; color: #555; }
  </style>
</head>
<body>

<canvas id="lobby-bg"></canvas>
<div id="lobby-bg-dim"></div>

<div class="lobby-content">
  <img class="title-banner" src="/backgrounds/title.webp" alt="Barrage" />

  <main>
    <div class="panel-card user-bar-card">
      <div class="user-bar">
        Playing as <span class="username" id="username-display">…</span>
      </div>
      <div style="display:flex;gap:0.5rem;align-items:center">
        <button class="btn-leaderboard" id="leaderboard-btn">🏆 Leaderboard</button>
        <button class="logout-btn" id="logout-btn">Logout</button>
      </div>
    </div>

    <!-- Leaderboard panel (toggled) -->
    <div id="leaderboard-panel">
      <div class="panel-card" style="display:flex;flex-direction:column;gap:1.2rem">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <span class="section-title">Leaderboard</span>
          <button class="refresh-btn" id="lb-refresh-btn">↻ Refresh</button>
        </div>
        <div id="lb-table-wrap"><p class="status-msg">Loading…</p></div>
      </div>
      <div class="panel-card" style="display:flex;flex-direction:column;gap:0.8rem">
        <span class="section-title">Your Enemies Defeated</span>
        <div id="lb-enemies-wrap"><p class="status-msg">Loading…</p></div>
      </div>
    </div>

    <div id="game-sections">
    <div class="section">
      <div class="section-title">Start a game</div>
      <div class="panel-card host-card">
        <div class="host-desc">
          <strong>Host a Game</strong>
          Create a room and wait for an opponent to join.
          The game runs directly in your browser — no server lag.
        </div>
        <button class="btn-primary" id="host-btn">Host Game</button>
      </div>
      <p class="error-msg" id="host-error" style="display:none"></p>
    </div>

    <div class="section">
      <div class="sessions-header">
        <div class="section-title">Join a game</div>
        <button class="refresh-btn" id="refresh-btn">↻ Refresh</button>
      </div>
      <div class="panel-card join-card">
        <div id="sessions-list">
          <p class="status-msg">Loading…</p>
        </div>
        <p class="error-msg" id="join-error" style="display:none"></p>
      </div>
    </div>
    </div> <!-- #game-sections -->
  </main>
</div>

<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
<script type="module">
  import { BARRAGE_CONFIG } from "/config.js";

  // ---------------------------------------------------------------------------
  // Auth guard
  // ---------------------------------------------------------------------------
  const token = sessionStorage.getItem("barrage_token");
  const username = sessionStorage.getItem("barrage_username");
  if (!token) window.location.replace("/login.html");

  document.getElementById("username-display").textContent = username ?? "?";
  document.getElementById("logout-btn").addEventListener("click", () => {
    sessionStorage.removeItem("barrage_token");
    sessionStorage.removeItem("barrage_username");
    window.location.href = "/login.html";
  });

  // ---------------------------------------------------------------------------
  // Background 3D scene
  // ---------------------------------------------------------------------------
  (async () => {
    const canvas = document.getElementById("lobby-bg");
    const engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: false, stencil: false });
    const scene  = new BABYLON.Scene(engine);
    scene.clearColor = new BABYLON.Color4(0.039, 0.039, 0.059, 1);

    // Image processing — same as game client
    scene.imageProcessingConfiguration.exposure = BARRAGE_CONFIG.exposure ?? 1.0;
    scene.imageProcessingConfiguration.contrast = BARRAGE_CONFIG.contrast ?? 1.0;

    // Pick a random level
    const LEVEL_FILES = ["level1.glb", "level2.glb", "level3.glb", "level4.glb"];
    const levelFile = LEVEL_FILES[Math.floor(Math.random() * LEVEL_FILES.length)];

    // Load level GLB (visual only, no physics)
    try {
      await BABYLON.SceneLoader.AppendAsync("/assets/", levelFile, scene);
      // Hide collider-only meshes (same rule as client)
      for (const mesh of scene.meshes) {
        const n = mesh.name.toLowerCase();
        if ((n.includes("col") || n.includes("collider")) && !n.includes("colvis")) {
          mesh.isVisible = false;
        }
      }
    } catch (e) {
      console.warn("[lobby] GLB load failed:", e.message);
    }

    // Camera — mirrors ensureCameraAndLight() + initCameraPositions() in client.js
    const glbCamPos = scene.cameras.length > 0
      ? (scene.cameras[0].globalPosition?.clone() ?? scene.cameras[0].position.clone())
      : new BABYLON.Vector3(0, 0, 100);
    for (const c of [...scene.cameras]) c.dispose();

    const camera = new BABYLON.FreeCamera("LobbyCamera", glbCamPos, scene);
    camera.fov      = BARRAGE_CONFIG.cameraVFov ?? 0.4;
    camera.minZ     = 0.1;
    camera.maxZ     = 500;
    camera.rotation.y = Math.PI;
    camera.inputs.clear();
    scene.activeCamera = camera;

    // Read viewport-vertical_boundary node (same as camera_control.js)
    let bottomY = BARRAGE_CONFIG.viewportBottomY ?? -8;
    const vbNode = scene.meshes.find(m => m.name.toLowerCase() === "viewport-vertical_boundary")
      ?? scene.transformNodes.find(m => m.name.toLowerCase() === "viewport-vertical_boundary");
    if (vbNode) {
      if (vbNode.isVisible !== undefined) vbNode.isVisible = false;
      for (const child of (vbNode.getChildMeshes?.() ?? [])) child.isVisible = false;
      vbNode.computeWorldMatrix(true);
      const { min, max } = vbNode.getHierarchyBoundingVectors(true);
      bottomY = (min.y + max.y) / 2;
    }

    // computeCamPos — same formula as camera_control.js
    {
      const xMin = BARRAGE_CONFIG.viewportBfXMin ?? -45;
      const xMax = BARRAGE_CONFIG.viewportBfXMax ?? 45;
      const width    = xMax - xMin;
      const centreX  = (xMin + xMax) / 2;
      const ar       = engine.getAspectRatio(camera);
      const vFov     = camera.fov;
      const hFov     = 2 * Math.atan(Math.tan(vFov / 2) * ar);
      const dist     = (width / 2) / Math.tan(hFov / 2);
      const camY     = bottomY + dist * Math.tan(vFov / 2);
      camera.position.set(centreX, camY, dist);
    }

    // Lighting — mirrors ensureCameraAndLight() in client.js
    if (scene.lights.length === 0) {
      const fallback = new BABYLON.HemisphericLight("FallbackLight", new BABYLON.Vector3(0, 1, 0), scene);
      fallback.intensity = BARRAGE_CONFIG.fallbackLightIntensity ?? 0.8;
    } else {
      const scale = BARRAGE_CONFIG.importedLightIntensityScale ?? 1.0;
      for (const light of scene.lights) light.intensity *= scale;
    }

    engine.runRenderLoop(() => scene.render());
    window.addEventListener("resize", () => engine.resize());
  })();

  // ---------------------------------------------------------------------------
  // Host
  // ---------------------------------------------------------------------------
  document.getElementById("host-btn").addEventListener("click", async () => {
    const btn    = document.getElementById("host-btn");
    const errEl  = document.getElementById("host-error");
    btn.disabled = true;
    errEl.style.display = "none";

    try {
      const res  = await fetch("/api/sessions", { method: "POST", headers: { Authorization: `Bearer ${token}` } });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error ?? "Failed to create session");
      window.location.href = `/?mode=host&session=${data.sessionId}`;
    } catch (err) {
      errEl.textContent   = err.message;
      errEl.style.display = "";
      btn.disabled        = false;
    }
  });

  // ---------------------------------------------------------------------------
  // Join — session list
  // ---------------------------------------------------------------------------
  function timeAgo(ts) {
    const s = Math.round((Date.now() - ts) / 1000);
    if (s < 5)  return "just now";
    if (s < 60) return `${s}s ago`;
    return `${Math.round(s / 60)}m ago`;
  }

  function escHtml(str) {
    return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  async function loadSessions() {
    const listEl = document.getElementById("sessions-list");
    const errEl  = document.getElementById("join-error");
    errEl.style.display = "none";

    try {
      const res  = await fetch("/api/lobby", { headers: { Authorization: `Bearer ${token}` } });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error ?? "Failed to load sessions");

      const sessions = data.sessions ?? [];
      if (sessions.length === 0) {
        listEl.innerHTML = `<p class="empty-state">No games available — host one!</p>`;
        return;
      }

      listEl.innerHTML = sessions.map((s) => `
        <div class="session-row">
          <div>
            <span class="session-host">${escHtml(s.hostUsername)}</span>
            <span class="session-age"> · ${timeAgo(s.createdAt)}</span>
          </div>
          <button class="btn-join" data-session="${escHtml(s.id)}">Join</button>
        </div>
      `).join("");

      listEl.querySelectorAll(".btn-join").forEach((btn) => {
        btn.addEventListener("click", () => {
          window.location.href = `/?mode=guest&session=${btn.dataset.session}`;
        });
      });
    } catch (err) {
      errEl.textContent   = err.message;
      errEl.style.display = "";
      listEl.innerHTML    = "";
    }
  }

  document.getElementById("refresh-btn").addEventListener("click", loadSessions);
  loadSessions();
  setInterval(loadSessions, 5000);

  // ---------------------------------------------------------------------------
  // Leaderboard
  // ---------------------------------------------------------------------------
  let leaderboardOpen = false;

  function dateStr(ts) {
    return new Date(ts).toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" });
  }

  async function loadLeaderboard() {
    const tableWrap   = document.getElementById("lb-table-wrap");
    const enemiesWrap = document.getElementById("lb-enemies-wrap");
    tableWrap.innerHTML   = `<p class="status-msg">Loading…</p>`;
    enemiesWrap.innerHTML = `<p class="status-msg">Loading…</p>`;

    try {
      const [lbRes, enRes] = await Promise.all([
        fetch("/api/leaderboard", { headers: { Authorization: `Bearer ${token}` } }),
        fetch("/api/me/enemies",  { headers: { Authorization: `Bearer ${token}` } }),
      ]);
      const lbData = await lbRes.json();
      const enData = await enRes.json();

      if (!lbData.ok) throw new Error(lbData.error);

      const rows = lbData.leaderboard ?? [];
      if (rows.length === 0) {
        tableWrap.innerHTML = `<p class="empty-state">No registered players yet.</p>`;
      } else {
        tableWrap.innerHTML = `
          <table class="lb-table">
            <thead>
              <tr>
                <th>#</th><th>Player</th>
                <th>Battles Won</th><th>Battles Lost</th>
                <th>Wars Won</th><th>Wars Lost</th>
              </tr>
            </thead>
            <tbody>
              ${rows.map((r, i) => `
                <tr>
                  <td class="rank">${i + 1}</td>
                  <td class="${r.username === username ? "me" : ""}">${escHtml(r.username)}</td>
                  <td>${r.battles_won}</td><td>${r.battles_lost}</td>
                  <td>${r.wars_won}</td><td>${r.wars_lost}</td>
                </tr>
              `).join("")}
            </tbody>
          </table>`;
      }

      const enemies = enData.enemies ?? [];
      if (enemies.length === 0) {
        enemiesWrap.innerHTML = `<p class="empty-state">No enemies defeated yet.</p>`;
      } else {
        enemiesWrap.innerHTML = `<div class="enemies-list">
          ${enemies.map(e => `
            <div class="enemy-row">
              <span class="enemy-name">${escHtml(e.username)}</span>
              <span class="enemy-date">${dateStr(e.defeatedAt)}</span>
            </div>`).join("")}
        </div>`;
      }
    } catch (err) {
      tableWrap.innerHTML = `<p class="error-msg">${escHtml(err.message)}</p>`;
    }
  }

  function toggleLeaderboard() {
    leaderboardOpen = !leaderboardOpen;
    const panel      = document.getElementById("leaderboard-panel");
    const gameSects  = document.getElementById("game-sections");
    const btn        = document.getElementById("leaderboard-btn");
    panel.classList.toggle("open", leaderboardOpen);
    gameSects.style.display = leaderboardOpen ? "none" : "";
    btn.classList.toggle("active", leaderboardOpen);
    btn.textContent = leaderboardOpen ? "✕ Close" : "🏆 Leaderboard";
    if (leaderboardOpen) loadLeaderboard();
  }

  document.getElementById("leaderboard-btn").addEventListener("click", toggleLeaderboard);
  document.getElementById("lb-refresh-btn").addEventListener("click", loadLeaderboard);
</script>
</body>
</html>
